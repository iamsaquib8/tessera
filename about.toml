# Used by `cargo about generate about.hbs > THIRD-PARTY-NOTICES`.
# The licenses the dependency tree has today; deny.toml enforces the same list.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
# The crates of every platform the release builds for, so the file is the same
# wherever it is generated.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
