# Checked by `cargo deny check` (the `deny` job in .github/workflows/ci.yml, and
# weekly for advisories in .github/workflows/advisories.yml).

[graph]
all-features = true

[advisories]
# A crate with a known vulnerability or a yanked version fails the check.
yanked = "deny"
# An unmaintained crate is reported but does not fail a build.
unmaintained = "all"
ignore = []

[licenses]
# The licenses the dependency tree has today, all compatible with shipping
# Tessera under Apache-2.0. Anything else fails until someone reviews it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Tessera makes no network calls (SECURITY.md). A dependency that brings an HTTP
# client would break that promise, so the build stops until it is discussed.
deny = [
    { crate = "reqwest" },
    { crate = "ureq" },
    { crate = "hyper" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "attohttpc" },
    { crate = "surf" },
]
