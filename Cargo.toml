[package]
name = "tessera-codegraph"
version = "1.2.0"
edition = "2021"
authors = ["Saquib <saquibulhassan6@gmail.com>"]
description = "Deterministic edit safety for AI coding agents: blast radius before an edit, verification after it, and a contract map across services. Local code graph, CLI, MCP server and hooks for 12 languages."
license = "Apache-2.0"
repository = "https://github.com/iamsaquib8/tessera"
homepage = "https://github.com/iamsaquib8/tessera"
documentation = "https://docs.rs/tessera-codegraph"
readme = "README.md"
rust-version = "1.90"
keywords = ["mcp", "codegraph", "tree-sitter", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/ISSUE_TEMPLATE/*"]

[lib]
name = "tessera_codegraph"
path = "src/lib.rs"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4"
globset = "0.4"
ignore = "0.4"
notify-debouncer-mini = "0.7"
regex = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
strsim = "0.11"
tempfile = "3.13"
tiny_http = "0.12"
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
walkdir = "2.5"
yaml-rust2 = { version = "0.10", default-features = false }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
assert_cmd = "2.0"
predicates = "3.1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tessera-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Linux hosts get the static musl build, which runs on any glibc version.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tessera-x86_64-unknown-linux-musl{ archive-suffix }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/tessera-aarch64-unknown-linux-musl{ archive-suffix }"
