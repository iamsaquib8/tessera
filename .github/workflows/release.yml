name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.10.0"
        required: true

# Read by default; each job below asks for the writes it needs.
permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Tags with a pre-release suffix (v0.10.0-rc.1) never become `latest` anywhere.
  PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-') }}

jobs:
  # A draft release collects assets; it is published only after every binary
  # job succeeds, so `releases/latest` never points at a release without files.
  release:
    name: create draft release
    # Creates the draft release.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Extract the release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          # The body of the `## <version>` section: everything up to the next
          # `## ` heading, without blank lines at either end.
          section() {
            awk -v heading="## $1" '
              /^## / {
                if (found) exit
                if ($0 == heading || index($0, heading " ") == 1) { found = 1; next }
              }
              found { lines[++n] = $0 }
              END {
                first = 1
                while (first <= n && lines[first] ~ /^[[:space:]]*$/) first++
                while (n >= first && lines[n] ~ /^[[:space:]]*$/) n--
                for (i = first; i <= n; i++) print lines[i]
              }
            ' CHANGELOG.md
          }
          section "$version" > "$notes"
          # A release candidate may be described by `## Unreleased` or by the
          # fragments in changes/ that the final release will assemble.
          if [ ! -s "$notes" ] && [ "$PRERELEASE" = true ]; then
            section Unreleased > "$notes"
          fi
          if [ ! -s "$notes" ] && [ "$PRERELEASE" = true ]; then
            node scripts/changelog.js preview > "$notes" || true
          fi
          if [ ! -s "$notes" ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no non-empty '## $version' section for $TAG. Add one (with its date) before releasing."
            exit 1
          fi
          echo "file=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Notes of a published release may have been edited by hand; a
            # draft only has what an earlier run of this job wrote.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
            echo "::notice::Release $TAG already exists; reusing it."
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$NOTES_FILE"
          fi

  binaries:
    name: binary (${{ matrix.target }})
    needs: release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    # Uploads the archives to the draft release.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: tessera
          target: ${{ matrix.target }}
          archive: tessera-$target
          # The license and the third-party notices go with every binary.
          include: LICENSE,THIRD-PARTY-NOTICES,README.md
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: checksums, provenance, publish
    needs: binaries
    # Uploads SHA256SUMS, attests the archives, publishes the release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern 'tessera-*'
          ls -l dist
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Write the SBOM
        id: sbom
        run: |
          set -euo pipefail
          # CycloneDX, for every dependency of every platform the release builds.
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --override-filename "tessera-${TAG#v}.cdx"
          mv "tessera-${TAG#v}.cdx.json" dist/
          echo "path=dist/tessera-${TAG#v}.cdx.json" >> "$GITHUB_OUTPUT"
          ls -l dist
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum tessera-*.tar.gz tessera-*.zip > SHA256SUMS
          cat SHA256SUMS
      # `gh attestation verify` then works for the archives, the SBOM and
      # SHA256SUMS, the file install.sh trusts.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/tessera-*
            dist/SHA256SUMS
      - uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: |
            dist/tessera-*.tar.gz
            dist/tessera-*.zip
          sbom-path: ${{ steps.sbom.outputs.path }}
      - name: Upload SHA256SUMS and the SBOM, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SBOM: ${{ steps.sbom.outputs.path }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/SHA256SUMS "$SBOM" --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  crates:
    name: publish crates.io
    needs: publish
    # crates.io versions are permanent, so release candidates stay off it.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    # Only the crates.io token is needed.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Publish (idempotent; skipped without a token)
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CRATES_IO_TOKEN:-}" ]; then
            echo "::notice::CRATES_IO_TOKEN not set; skipping crates.io."
            exit 0
          fi
          output=$(cargo publish --locked --token "$CRATES_IO_TOKEN" 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -Eq "already (uploaded|exists)"; then
            echo "::notice::Version already on crates.io."
            exit 0
          fi
          exit $status

  npm:
    name: publish npm
    needs: publish
    # id-token: npm trusted publishing and provenance.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern 'tessera-*'
      - run: node npm/scripts/build-platform-packages.js "${TAG#v}" dist
      # Trusted publishing (OIDC, configured per package on npmjs.com) needs
      # npm 11.5.1 or later; it needs no token and no 2FA code. NPM_TOKEN, if
      # set, is the fallback for packages without a trusted publisher.
      - run: npm install -g npm@11
      - name: Publish platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN not set; publishing through trusted publishing only."
          fi
          version="${TAG#v}"
          dist_tag=latest
          if [ "$PRERELEASE" = true ]; then dist_tag=next; fi
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              npm publish "$1" --access public --provenance --tag "$dist_tag"
            fi
          }
          for dir in npm/platforms/*/; do
            publish "${dir%/}"
          done
          publish npm

  homebrew:
    name: update Homebrew tap
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    # Pushes to the tap with its own token.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
      - name: Render formula and push to iamsaquib8/homebrew-tessera
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping Homebrew."
            exit 0
          fi
          gh release download "$TAG" --pattern SHA256SUMS --dir dist
          sh packaging/homebrew/render.sh "${TAG#v}" dist/SHA256SUMS > tessera.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/iamsaquib8/homebrew-tessera.git" tap
          mkdir -p tap/Formula
          cp tessera.rb tap/Formula/tessera.rb
          cd tap
          git config user.name "tessera-release"
          git config user.email "tessera-release@users.noreply.github.com"
          git add Formula/tessera.rb
          git diff --cached --quiet || git commit -m "tessera ${TAG}"
          git push

  # Releases published with GITHUB_TOKEN start no other workflows, so the image
  # and the install smoke tests run here, after every channel is published.
  docker:
    name: container image
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  smoke:
    name: install smoke tests
    needs: [npm, crates, homebrew, docker]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  # The docs site describes the latest release, so it is published here, from
  # the release's own tag, and only for a stable release.
  docs:
    name: docs site
    needs: smoke
    if: ${{ needs.smoke.result == 'success' && !contains(inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  # `iamsaquib8/tessera/action@v1` resolves to the `v1` tag, so it follows the
  # newest stable 1.x release. Moved last, once every channel installs.
  major-tag:
    name: move the major tag
    needs: smoke
    if: ${{ needs.smoke.result == 'success' && !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Point the major tag at the release commit
        id: move
        run: |
          set -euo pipefail
          # A stable tag only: v1.2.3. Pre-releases (v1.3.0-rc.1) never move it.
          case "$TAG" in
            *-*)
              echo "$TAG is a pre-release; the major tag stays where it is."
              exit 0
              ;;
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::$TAG is not a vMAJOR.MINOR.PATCH tag."
              exit 1
              ;;
          esac
          major="${TAG%%.*}"
          git fetch --force --tags origin
          release=$(git rev-parse "refs/tags/$TAG^{commit}")

          # Never backwards: a newer stable release of this major version wins,
          # so re-running an old release leaves the tag alone.
          newest=$(git tag --list "$major.*" | grep -Ev -- '-' | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::$newest is newer than $TAG; $major stays where it is."
            exit 0
          fi
          if current=$(git rev-parse --verify --quiet "refs/tags/$major^{commit}"); then
            if [ "$current" = "$release" ]; then
              echo "$major already points at $TAG ($release)."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$current" "$release"; then
              echo "::notice::$major points at $current, which is not an ancestor of $TAG; leaving it."
              exit 0
            fi
          fi
          git tag --force "$major" "$release"
          git push --force origin "refs/tags/$major"
          echo "$major now points at $TAG ($release)."
