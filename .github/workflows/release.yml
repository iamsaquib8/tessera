name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.10.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Tags with a pre-release suffix (v0.10.0-rc.1) never become `latest` anywhere.
  PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-') }}

jobs:
  # A draft release collects assets; it is published only after every binary
  # job succeeds, so `releases/latest` never points at a release without files.
  release:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; reusing it."
            exit 0
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi

  binaries:
    name: binary (${{ matrix.target }})
    needs: release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tessera
          target: ${{ matrix.target }}
          archive: tessera-$target
          ref: refs/tags/${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: checksums, provenance, publish
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern 'tessera-*'
          ls -l dist
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum tessera-*.tar.gz tessera-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/tessera-*"
      - name: Upload SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/SHA256SUMS --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

  crates:
    name: publish crates.io
    needs: publish
    # crates.io versions are permanent, so release candidates stay off it.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish (idempotent; skipped without a token)
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${CRATES_IO_TOKEN:-}" ]; then
            echo "::notice::CRATES_IO_TOKEN not set; skipping crates.io."
            exit 0
          fi
          output=$(cargo publish --locked --token "$CRATES_IO_TOKEN" 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && echo "$output" | grep -Eq "already (uploaded|exists)"; then
            echo "::notice::Version already on crates.io."
            exit 0
          fi
          exit $status

  npm:
    name: publish npm
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern 'tessera-*'
      - run: node npm/scripts/build-platform-packages.js "${TAG#v}" dist
      # Trusted publishing (OIDC, configured per package on npmjs.com) needs
      # npm 11.5.1 or later; it needs no token and no 2FA code. NPM_TOKEN, if
      # set, is the fallback for packages without a trusted publisher.
      - run: npm install -g npm@11
      - name: Publish platform packages, then the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN not set; publishing through trusted publishing only."
          fi
          version="${TAG#v}"
          dist_tag=latest
          if [ "$PRERELEASE" = true ]; then dist_tag=next; fi
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published"
            else
              npm publish "$1" --access public --provenance --tag "$dist_tag"
            fi
          }
          for dir in npm/platforms/*/; do
            publish "${dir%/}"
          done
          publish npm

  homebrew:
    name: update Homebrew tap
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Render formula and push to iamsaquib8/homebrew-tessera
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping Homebrew."
            exit 0
          fi
          gh release download "$TAG" --pattern SHA256SUMS --dir dist
          sh packaging/homebrew/render.sh "${TAG#v}" dist/SHA256SUMS > tessera.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/iamsaquib8/homebrew-tessera.git" tap
          mkdir -p tap/Formula
          cp tessera.rb tap/Formula/tessera.rb
          cd tap
          git config user.name "tessera-release"
          git config user.email "tessera-release@users.noreply.github.com"
          git add Formula/tessera.rb
          git diff --cached --quiet || git commit -m "tessera ${TAG}"
          git push

  # Releases published with GITHUB_TOKEN start no other workflows, so the image
  # and the install smoke tests run here, after every channel is published.
  docker:
    name: container image
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  smoke:
    name: install smoke tests
    needs: [npm, crates, homebrew, docker]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
