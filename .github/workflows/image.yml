name: Image

# Builds the container image on pull requests that could break it, so a broken
# Dockerfile is found before a release tag. Nothing is pushed.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - src/**
      - packs/**
      - Cargo.toml
      - Cargo.lock
      - about.toml
      - LICENSE
      - THIRD-PARTY-NOTICES
      - .github/workflows/image.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tessera:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs, as a numeric user
        run: |
          set -euo pipefail
          docker run --rm --entrypoint tessera tessera:pr --version
          user=$(docker inspect --format '{{.Config.User}}' tessera:pr)
          echo "user: $user"
          [ "$user" = "10001:10001" ]
